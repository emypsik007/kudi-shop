<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUDI SHOP | Магазин одежды</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a2e 0%, #1a1a4e 50%, #0d0d3a 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .app-container {
            position: relative;
            z-index: 1;
            padding-bottom: 80px;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            font-size: 24px;
            text-align: center;
            background: linear-gradient(90deg, #00d9ff, #ff00ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            text-align: center;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 217, 255, 0.3);
            border-top: 3px solid #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .search-container {
            padding: 15px 20px;
        }

        .search-bar {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }

        .search-bar::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .categories {
            display: flex;
            gap: 10px;
            padding: 10px 20px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .category-btn.active,
        .category-btn:hover {
            background: linear-gradient(90deg, #00d9ff, #ff00ff);
        }

        .section {
            display: none;
            padding: 20px;
        }

        .section.active {
            display: block;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 217, 255, 0.3);
        }

        .product-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
        }

        .product-name {
            font-size: 14px;
            margin: 10px 0 5px;
        }

        .product-price {
            font-size: 16px;
            font-weight: bold;
            color: #00d9ff;
        }

        .product-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .btn-cart {
            background: linear-gradient(90deg, #00d9ff, #0099ff);
            color: #ffffff;
        }

        .btn-favorite {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .btn-favorite.active {
            background: linear-gradient(90deg, #ff0066, #ff6699);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 46, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            z-index: 1000;
        }

        .nav-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            max-width: 500px;
            margin: 0 auto;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 10px 15px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.6);
        }

        .nav-item.active {
            background: rgba(0, 217, 255, 0.2);
            color: #00d9ff;
        }

        .nav-icon {
            font-size: 24px;
        }

        .nav-label {
            font-size: 11px;
        }

        .cart-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .cart-item-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .qty-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 217, 255, 0.3);
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
        }

        .checkout-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(90deg, #00d9ff, #ff00ff);
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .profile-section {
            text-align: center;
            padding: 30px 20px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(90deg, #00d9ff, #ff00ff);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .profile-name {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #00d9ff;
        }

        .stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: rgba(255, 255, 255, 0.6);
        }

        .empty-state-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 217, 255, 0.9);
            color: #ffffff;
            padding: 12px 25px;
            border-radius: 25px;
            z-index: 2000;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="app-container">
        <header class="header">
            <h1>🌌 KUDI SHOP</h1>
        </header>

        <div class="search-container" id="searchContainer">
            <input type="text" class="search-bar" id="searchBar" placeholder="🔍 Поиск товаров...">
        </div>

        <div class="categories" id="categoriesContainer">
            <button class="category-btn active" data-category="all">🔥 Все</button>
            <button class="category-btn" data-category="hoodies">👕 Худи</button>
            <button class="category-btn" data-category="tshirts">👕 Футболки</button>
            <button class="category-btn" data-category="pants">👖 Штаны</button>
            <button class="category-btn" data-category="accessories">🎒 Аксессуары</button>
        </div>

        <div id="loadingContainer" class="loading-container" style="display: none;">
            <div class="loader"></div>
            <p>Загрузка товаров...</p>
        </div>

        <section class="section active" id="homeSection">
            <div class="products-grid" id="productsGrid"></div>
        </section>

        <section class="section" id="favoritesSection">
            <h2 style="margin-bottom: 20px;">❤️ Избранное</h2>
            <div class="products-grid" id="favoritesGrid"></div>
            <div class="empty-state" id="favoritesEmpty" style="display: none;">
                <div class="empty-state-icon">💔</div>
                <p>В избранном пока пусто</p>
            </div>
        </section>

        <section class="section" id="cartSection">
            <h2 style="margin-bottom: 20px;">🛒 Корзина</h2>
            <div id="cartItems"></div>
            <div class="empty-state" id="cartEmpty" style="display: none;">
                <div class="empty-state-icon">🛒</div>
                <p>Корзина пуста</p>
            </div>
            <div id="cartSummary" style="display: none;">
                <div style="text-align: right; margin: 20px 0; font-size: 18px;">
                    Итого: <span id="cartTotal" style="color: #00d9ff; font-weight: bold;">0 ₽</span>
                </div>
                <button class="checkout-btn" onclick="checkout()">✅ Оформить заказ</button>
            </div>
        </section>

        <section class="section" id="profileSection">
            <div class="profile-section">
                <div class="profile-avatar" id="profileAvatar">👤</div>
                <h2 class="profile-name" id="profileName">Гость</h2>
                <p style="color: rgba(255,255,255,0.6);">@username</p>
                
                <div class="profile-stats">
                    <div class="stat-card">
                        <div class="stat-value" id="statOrders">0</div>
                        <div class="stat-label">Заказов</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statFavorites">0</div>
                        <div class="stat-label">Избранное</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statSpent">0 ₽</div>
                        <div class="stat-label">Потрачено</div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <nav class="bottom-nav">
        <div class="nav-container">
            <div class="nav-item active" data-section="home">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Главная</span>
            </div>
            <div class="nav-item" data-section="favorites">
                <span class="nav-icon">❤️</span>
                <span class="nav-label">Избранное</span>
            </div>
            <div class="nav-item" data-section="cart">
                <span class="nav-icon">🛒</span>
                <span class="nav-label">Корзина</span>
            </div>
            <div class="nav-item" data-section="profile">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Профиль</span>
            </div>
        </div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const user = tg.initDataUnsafe?.user || {
            first_name: 'Гость',
            username: 'guest',
            id: 0
        };

        let products = [];
        let cart = JSON.parse(localStorage.getItem('kudi_cart')) || [];
        let favorites = JSON.parse(localStorage.getItem('kudi_favorites')) || [];
        let currentCategory = 'all';

        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(star);
            }
        }

        function showLoading() {
            document.getElementById('loadingContainer').style.display = 'flex';
            document.getElementById('productsGrid').style.display = 'none';
        }

        function hideLoading() {
            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('productsGrid').style.display = 'grid';
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 2000);
        }

        // Отрисовка товаров
        function renderProducts(productsToRender, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';

            if (!productsToRender || productsToRender.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="empty-state-icon">🔍</div>
                        <p>Товары не найдены</p>
                    </div>
                `;
                return;
            }

            productsToRender.forEach(product => {
                const isFavorite = favorites.includes(product.id);
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${product.image}" alt="${product.name}" class="product-image" onerror="this.src='https://via.placeholder.com/300x300/1a1a4e/00d9ff?text=No+Image'">
                    <h3 class="product-name">${product.name}</h3>
                    <p class="product-price">${product.price} ₽</p>
                    <div class="product-actions">
                        <button class="btn btn-cart" onclick="addToCart(${product.id})">🛒 В корзину</button>
                        <button class="btn btn-favorite ${isFavorite ? 'active' : ''}" onclick="toggleFavorite(${product.id})">
                            ${isFavorite ? '❤️' : '🤍'}
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function applyFiltersAndRender() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const filtered = products.filter(p => 
                (currentCategory === 'all' || p.category === currentCategory) &&
                p.name.toLowerCase().includes(query)
            );
            renderProducts(filtered, 'productsGrid');
        }

        function renderFavorites() {
            const favoriteProducts = products.filter(p => favorites.includes(p.id));
            renderProducts(favoriteProducts, 'favoritesGrid');
            const emptyState = document.getElementById('favoritesEmpty');
            if (emptyState) emptyState.style.display = favoriteProducts.length === 0 ? 'block' : 'none';
            const statFavorites = document.getElementById('statFavorites');
            if (statFavorites) statFavorites.textContent = favoriteProducts.length;
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            const emptyState = document.getElementById('cartEmpty');
            const summary = document.getElementById('cartSummary');
            if (!container) return;
            container.innerHTML = '';

            if (cart.length === 0) {
                if (emptyState) emptyState.style.display = 'block';
                if (summary) summary.style.display = 'none';
                return;
            }

            if (emptyState) emptyState.style.display = 'none';
            if (summary) summary.style.display = 'block';

            let total = 0;

            cart.forEach(item => {
                const product = products.find(p => p.id === item.id);
                if (!product) return;
                total += product.price * item.quantity;

                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';
                cartItem.innerHTML = `
                    <img src="${product.image}" class="cart-item-image" onerror="this.src='https://via.placeholder.com/80x80/1a1a4e/00d9ff?text=No+Image'">
                    <div class="cart-item-info">
                        <h4>${product.name}</h4>
                        <p style="color: #00d9ff;">${product.price} ₽</p>
                        <div class="cart-item-quantity">
                            <button class="qty-btn" onclick="updateQuantity(${item.id}, -1)">−</button>
                            <span>${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `;
                container.appendChild(cartItem);
            });

            document.getElementById('cartTotal').textContent = total + ' ₽';
        }

        function updateProfile() {
            document.getElementById('profileName').textContent = user.first_name || 'Гость';
            const usernameElement = document.querySelector('#profileName + p');
            if (usernameElement) usernameElement.textContent = user.username ? '@' + user.username : '@guest';
            
            const orders = JSON.parse(localStorage.getItem('kudi_orders')) || [];
            const userOrders = orders.filter(o => o.user_id === user.id);
            document.getElementById('statOrders').textContent = userOrders.length;
            const totalSpent = userOrders.reduce((sum, order) => sum + order.total, 0);
            document.getElementById('statSpent').textContent = totalSpent + ' ₽';
        }

        function addToCart(productId) {
            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ id: productId, quantity: 1 });
            }
            localStorage.setItem('kudi_cart', JSON.stringify(cart));
            renderCart();
            showNotification('✅ Товар добавлен в корзину');
        }

        function updateQuantity(productId, change) {
            const item = cart.find(item => item.id === productId);
            if (!item) return;
            item.quantity += change;
            if (item.quantity <= 0) {
                cart = cart.filter(i => i.id !== productId);
            }
            localStorage.setItem('kudi_cart', JSON.stringify(cart));
            renderCart();
        }

        function toggleFavorite(productId) {
            const index = favorites.indexOf(productId);
            if (index === -1) {
                favorites.push(productId);
                showNotification('❤️ Добавлено в избранное');
            } else {
                favorites.splice(index, 1);
                showNotification('🤍 Удалено из избранного');
            }
            localStorage.setItem('kudi_favorites', JSON.stringify(favorites));
            applyFiltersAndRender();
            renderFavorites();
            updateProfile();
        }

        function switchSection(sectionName) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.section === sectionName);
            });
            document.querySelectorAll('.section').forEach(section => {
                section.classList.toggle('active', section.id === sectionName + 'Section');
            });
            const searchContainer = document.getElementById('searchContainer');
            const categoriesContainer = document.getElementById('categoriesContainer');
            if (sectionName === 'home') {
                if (searchContainer) searchContainer.style.display = 'block';
                if (categoriesContainer) categoriesContainer.style.display = 'flex';
            } else {
                if (searchContainer) searchContainer.style.display = 'none';
                if (categoriesContainer) categoriesContainer.style.display = 'none';
            }
            if (sectionName === 'favorites') renderFavorites();
            else if (sectionName === 'cart') renderCart();
            else if (sectionName === 'profile') updateProfile();
        }

        function checkout() {
            if (cart.length === 0) {
                showNotification('⚠️ Корзина пуста');
                return;
            }
            const orderData = {
                action: 'order',
                user: user,
                cart: cart.map(item => {
                    const product = products.find(p => p.id === item.id);
                    return {
                        name: product ? product.name : 'Товар',
                        price: product ? product.price : 0,
                        quantity: item.quantity
                    };
                }),
                total: cart.reduce((sum, item) => {
                    const product = products.find(p => p.id === item.id);
                    return sum + (product ? product.price * item.quantity : 0);
                }, 0)
            };
            const orders = JSON.parse(localStorage.getItem('kudi_orders')) || [];
            orders.push({ ...orderData, user_id: user.id, date: new Date().toISOString() });
            localStorage.setItem('kudi_orders', JSON.stringify(orders));
            tg.sendData(JSON.stringify(orderData));
            cart = [];
            localStorage.setItem('kudi_cart', JSON.stringify(cart));
            renderCart();
            showNotification('✅ Заказ оформлен!');
        }

        // ГЛАВНАЯ ФУНКЦИЯ - загрузка товаров из бота
        async function loadProductsFromBot() {
            showLoading();
            
            // Запрашиваем товары у бота
            tg.sendData(JSON.stringify({ action: 'get_products' }));
            
            // Устанавливаем таймаут на 3 секунды
            setTimeout(() => {
                if (products.length === 0) {
                    // Если бот не ответил, пробуем загрузить из кэша
                    const cached = localStorage.getItem('kudi_products_cache');
                    if (cached) {
                        try {
                            const cache = JSON.parse(cached);
                            if (cache.data && cache.data.length > 0) {
                                products = cache.data;
                                hideLoading();
                                applyFiltersAndRender();
                                renderFavorites();
                                renderCart();
                                updateProfile();
                                showNotification('📦 Загружены сохранённые товары');
                                return;
                            }
                        } catch(e) {}
                    }
                    hideLoading();
                    showNotification('⚠️ Не удалось загрузить товары. Проверьте, запущен ли бот.');
                }
            }, 3000);
        }

        // Функция для получения товаров от бота (вызывается из бота через ответ)
        window.updateProductsFromBot = function(productsData) {
            if (productsData && Array.isArray(productsData) && productsData.length > 0) {
                products = productsData;
                // Сохраняем в кэш
                localStorage.setItem('kudi_products_cache', JSON.stringify({
                    data: products,
                    timestamp: Date.now()
                }));
                hideLoading();
                applyFiltersAndRender();
                renderFavorites();
                renderCart();
                updateProfile();
                showNotification(`✅ Загружено ${products.length} товаров`);
            } else if (productsData && productsData.length === 0) {
                hideLoading();
                showNotification('📦 Товаров пока нет. Добавьте их через админ-панель.');
            }
        };

        // Навигация
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => switchSection(item.dataset.section));
        });

        // Поиск
        document.getElementById('searchBar').addEventListener('input', () => applyFiltersAndRender());

        // Категории
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                applyFiltersAndRender();
            });
        });

        createStars();
        loadProductsFromBot();
    </script>
</body>
</html>
